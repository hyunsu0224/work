name: コンポーネント要望
description: ワイヤーフレームビルダーに追加・改善してほしいコンポーネントや機能
title: "[要望] "
labels: ["component-request"]
body:
  - type: markdown
    attributes:
      value: "ご利用ありがとうございます。追加・改善してほしい内容を教えてください。"
  - type: dropdown
    id: kind
    attributes:
      label: 種類
      options:
        - 新規コンポーネント
        - 既存の改善
        - 不具合
        - その他
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 名称
      placeholder: "例) 比較表・カウントダウン・動画ブロック"
  - type: textarea
    id: desc
    attributes:
      label: 説明
      description: どんな要素で、どう動いてほしいか
      placeholder: "画像は右、左にタイトルと説明、右下に詳細ボタン… のように具体的に"
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: 参考URL・画像
      placeholder: 参考サイトやスクリーンショットのリンク
  - type: dropdown
    id: page
    attributes:
      label: 対象ページ
      multiple: true
      options:
        - top
        - list (商品一覧)
        - detail (商品詳細)
        - cart
        - mypage
        - lp / 特集
        - 共通
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - 高
        - 中
        - 低
